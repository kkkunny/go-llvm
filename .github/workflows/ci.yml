name: CI

# push 与 pull_request 均触发。
on:
  push:
  pull_request:

# 同一 ref 的新运行取消仍在进行的旧运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：工作流只读取仓库内容。
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 版本 tag 契约：不带 tag 构建 master 最新支持的 LLVM；llvmNN 精确锁定该
        # 大版本，两者都必须通过（调用方保证只带一个版本 tag）。llvm_release 与
        # 版本 tag 正交，可组合（见 AGENTS.md "Version tags"）。新增受支持大版本时
        # 在此追加行：{llvm: NN, flags: '-tags=llvmNN'}。
        include:
          - name: default
            llvm: 23
            flags: ''
            race: '-race'
          - name: release
            llvm: 23
            flags: '-tags=llvm_release'
            race: ''
          - name: llvm23
            llvm: 23
            flags: '-tags=llvm23'
            race: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          cache: true

      # 直接添加 apt.llvm.org 的 llvm-toolchain-noble-NN 源并只安装 llvm-NN-dev：
      # 相比 llvm.sh 附带安装的 clang/lldb 等组件，安装体积更小、步骤更可控。
      # 备选（手动加源尚不可用时）：改用官方脚本
      #   wget -q https://apt.llvm.org/llvm.sh
      #   chmod +x llvm.sh
      #   sudo ./llvm.sh NN
      #   sudo apt-get install -y llvm-NN-dev
      - name: Install LLVM ${{ matrix.llvm }}
        env:
          LLVM_MAJOR: ${{ matrix.llvm }}
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_MAJOR main" \
            | sudo tee /etc/apt/sources.list.d/llvm-apt.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-$LLVM_MAJOR-dev

      - name: Check gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Build
        run: go build ${{ matrix.flags }} ./...

      # go vet 需要 cgo 与 LLVM 头文件，因此必须与安装 LLVM 处于同一 job。
      - name: Vet
        run: go vet ${{ matrix.flags }} ./...

      - name: Test
        run: go test ${{ matrix.race }} ${{ matrix.flags }} ./...
