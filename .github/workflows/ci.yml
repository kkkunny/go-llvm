name: CI

# push 与 pull_request 均触发。
on:
  push:
  pull_request:

# 同一 ref 的新运行取消仍在进行的旧运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：工作流只读取仓库内容。
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # default → 全量校验；release → llvm_release 信任构建（语义检查被裁剪）。
        mode: [default, release]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          cache: true

      # 通过 apt.llvm.org 官方脚本安装 LLVM 22。
      # 脚本当前已支持 22，在 noble 上对应 llvm-toolchain-noble-22 源。
      # 若 llvm.sh 22 不可用（例如脚本尚未跟进新版本），改为手动添加源：
      #   wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
      #     | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
      #   sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main"
      #   sudo apt-get update
      #   sudo apt-get install -y llvm-22-dev
      - name: Install LLVM 22
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev

      - name: Check gofmt
        run: test -z "$(gofmt -l .)"

      - name: Build
        run: go build ./...

      # go vet 需要 cgo 与 LLVM 头文件，因此必须与安装 LLVM 处于同一 job。
      - name: Vet
        run: go vet ./...

      - name: Test (default)
        if: matrix.mode == 'default'
        run: go test ./...

      - name: Test (llvm_release)
        if: matrix.mode == 'release'
        run: go test -tags=llvm_release ./...
